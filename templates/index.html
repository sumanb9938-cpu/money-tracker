<!DOCTYPE html>
<html>
<head>
    <title>Money Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #1d2671, #c33764);
            color: white;
        }

        .card {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            border-radius: 15px;
        }

        input, select {
            background: white !important;
            color: black !important;
        }

        table {
            background: white;
            color: black;
        }
    </style>
</head>

<body>

<div class="container mt-4">

<div class="d-flex justify-content-between">
    <h3>💸 Dashboard</h3>
    <a href="/logout" class="btn btn-light">Logout</a>
</div>

<!-- SUMMARY -->
<div class="row mb-4">
    <div class="col-md-6">
        <div class="card p-3 text-center">
            <h5>To Claim</h5>
            <h3>₹{{ to_claim }}</h3>
        </div>
    </div>

    <div class="col-md-6">
        <div class="card p-3 text-center">
            <h5>To Pay</h5>
            <h3>₹{{ to_pay }}</h3>
        </div>
    </div>
</div>

<!-- ADD FORM -->
<form action="/add" method="POST" class="card p-3 mb-4">

<div class="row g-2">
    <div class="col-12 col-md-3">
        <input name="name" class="form-control" placeholder="Name">
    </div>

    <div class="col-12 col-md-2">
        <input name="amount" type="number" class="form-control" placeholder="Amount">
    </div>

    <div class="col-12 col-md-2">
        <select name="type" class="form-control">
            <option value="given">Gave</option>
            <option value="received">Claimed</option>
        </select>
    </div>

    <div class="col-12 col-md-3">
        <input name="date" type="date" class="form-control">
    </div>

    <div class="col-12 col-md-2">
        <button class="btn btn-primary w-100">Add</button>
    </div>
</div>

<input name="reason" class="form-control mt-2" placeholder="Reason">

</form>

<!-- SEARCH -->
<input id="search" class="form-control mb-3" placeholder="Search...">

<!-- TABLE -->
<table class="table table-bordered">
<tr>
    <th>Name</th>
    <th>Amount</th>
    <th>Type</th>
    <th>Date</th>
    <th>Status</th>
    <th>Action</th>
</tr>

{% for r in records %}
<tr>
    <td>{{ r[2] }}</td>
    <td>{{ r[3] }}</td>
    <td>{{ r[4] }}</td>
    <td>{{ r[5] }}</td>
    <td>{{ r[9] }}</td>
    <td>
        {% if r[9] == 'pending' %}
            <a href="/mark_paid/{{ r[0] }}" class="btn btn-success btn-sm">Paid</a>
        {% endif %}
        <a href="/delete/{{ r[0] }}" class="btn btn-danger btn-sm">Delete</a>
    </td>
</tr>
{% endfor %}

</table>

</div>

<script>
document.getElementById("search").addEventListener("keyup", function() {
    let val = this.value.toLowerCase();
    document.querySelectorAll("table tr").forEach(row => {
        row.style.display = row.innerText.toLowerCase().includes(val) ? "" : "none";
    });
});
</script>

</body>
</html>
