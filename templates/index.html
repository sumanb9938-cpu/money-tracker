<!DOCTYPE html>
<html>
<head>
<title>Money Tracker</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-4">

<h3>💸 Dashboard</h3>

<h5>To Claim: ₹{{ to_claim }}</h5>
<h5>To Pay: ₹{{ to_pay }}</h5>

<form action="/add" method="POST" class="mb-4">
<input name="name" placeholder="Name" class="form-control mb-2">
<input name="amount" placeholder="Amount" class="form-control mb-2">

<select name="type" class="form-control mb-2">
<option value="given">💸 Gave Money (To Claim)</option>
<option value="received">📥 Took Money (To Return)</option>
</select>

<input name="date" class="form-control mb-2">
<input name="reason" placeholder="Reason" class="form-control mb-2">

<button class="btn btn-primary">Add</button>
</form>

<h4>Records</h4>

<table class="table table-bordered">
<tr>
<th>Name</th>
<th>Amount</th>
<th>Action</th>
</tr>

{% for r in records %}
<tr>
<td>{{ r[2] }}</td>
<td>₹{{ r[3] }}</td>
<td>
<a href="/edit/{{ r[0] }}" class="btn btn-warning btn-sm">Edit</a>
<a href="/mark_paid/{{ r[0] }}" class="btn btn-success btn-sm">Paid</a>
<a href="/delete/{{ r[0] }}" class="btn btn-danger btn-sm">Delete</a>
</td>
</tr>
{% endfor %}

</table>

</body>
</html>
