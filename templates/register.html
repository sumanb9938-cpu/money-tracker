<!DOCTYPE html>
<html>
<head>
    <title>LedgerPro - Register</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            height: 100vh;
            background: linear-gradient(135deg, #c33764, #1d2671);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial;
        }

        .card {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(12px);
            border-radius: 15px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            color: white;
            text-align: center;
        }

        input {
            background: rgba(255,255,255,0.9) !important;
            color: black !important;
        }

        .btn-custom {
            background: white;
            color: black;
            font-weight: bold;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .tagline {
            font-size: 14px;
            color: #ddd;
            margin-bottom: 20px;
        }

        a {
            color: #fff;
        }
    </style>
</head>

<body>

<div class="card">

    <!-- LOGO -->
    <div class="logo">💼 LedgerPro</div>
    <div class="tagline">Manage Your Borrow & Lend Smartly</div>

    <h4 class="mb-3">📝 Create Account</h4>

    <form method="POST">
        <input name="username" class="form-control mb-3" placeholder="Username" required>
        <input name="password" type="password" class="form-control mb-3" placeholder="Password" required>

        <button class="btn btn-custom w-100">Register</button>
    </form>

    <p class="mt-3">
        Already have account? <a href="/login">Login</a>
    </p>

</div>

</body>
</html>
