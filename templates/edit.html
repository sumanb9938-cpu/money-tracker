<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LedgerPro - Edit Record</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Google Fonts for Inter and elegant Serif -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0b0b0e;
            color: #f0f0f0;
            
            /* Subtle Grid Background to match the image exactly */
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            overflow: hidden;
            position: relative;
        }

        /* Ambient global glow for the 'alive' feel (bottom left / top right) */
        .ambient-glow {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            mix-blend-mode: screen;
            z-index: 0;
        }
        .glow-1 {
            width: 60vh; height: 60vh;
            bottom: -20vh; left: -20vh;
            background: radial-gradient(circle, rgba(197, 160, 89, 0.05) 0%, transparent 70%);
            animation: pulseGlow 8s ease-in-out infinite alternate;
        }
        .glow-2 {
            width: 50vh; height: 50vh;
            top: -10vh; right: -10vh;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.02) 0%, transparent 70%);
            animation: pulseGlow 10s ease-in-out infinite alternate-reverse;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.3); opacity: 1; }
        }

        /* Mouse cursor active shine */
        .cursor-shine {
            position: fixed;
            top: 0; left: 0;
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(197, 160, 89, 0.12) 0%, rgba(255,255,255,0.02) 40%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 100;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity 0.3s ease;
            mix-blend-mode: screen;
        }

        .card-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 450px;
            border-radius: 16px;
            padding: 1px;
            background: linear-gradient(180deg, rgba(212,175,55,0.5) 0%, rgba(212,175,55,0.1) 100%);
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards, floatContainer 6s ease-in-out infinite alternate;
            box-shadow: 0 10px 40px rgba(212,175,55,0.15), 0 0 80px rgba(212,175,55,0.1);
        }

        .auth-card {
            background-color: #121214;
            border-radius: 15px;
            padding: 40px 30px;
            width: 100%;
            color: #fff;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(212,175,55,0.05);
        }

        .auth-card::before {
            content: ''; position: absolute; top: 0; left: -150%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.03), rgba(212, 175, 55, 0.15), rgba(255, 255, 255, 0.03), transparent);
            transform: skewX(-25deg); animation: shineSweep 6s infinite; pointer-events: none; z-index: 1;
        }
        
        @keyframes shineSweep {
            0% { left: -150%; } 20% { left: 250%; } 100% { left: 250%; }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes floatContainer {
            0% { transform: translateY(0px); } 100% { transform: translateY(-8px); }
        }

        /* Header / Logo */
        .logo-row {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;
        }
        
        .logo-display {
            display: flex; align-items: center; gap: 8px; font-weight: 400; letter-spacing: 2px; font-size: 14px;
        }

        .logo-icon {
            width: 25px; height: 25px; border: 1px solid rgba(197, 160, 89, 0.5); border-radius: 6px;
            display: flex; justify-content: center; align-items: center; color: #d4af37; font-size: 12px;
        }

        h2 { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 400; margin-bottom: 30px; color: #f0f0f0; }

        /* Forms */
        form { display: flex; flex-direction: column; gap: 15px; position:relative; z-index:2; }

        .form-group { display: flex; flex-direction: column; gap: 6px; }

        label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #777; font-weight: 600; }

        .input-wrapper { position: relative; width: 100%; }
        .input-wrapper i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #555; font-size: 14px; transition: color 0.3s; z-index: 5; }
        
        .input-wrapper select,
        .input-wrapper input {
            width: 100%; padding: 12px 15px 12px 45px; background: #1a1a1d; border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 8px;
            font-size: 14px; color: #fff; outline: none; transition: all 0.3s ease; appearance: none;
        }
        
        .input-wrapper .fa-chevron-down { left: auto; right: 15px; pointer-events: none; }

        .input-wrapper input:focus, .input-wrapper select:focus {
            background: #1f1f23; border: 1px solid rgba(212, 175, 55, 1); box-shadow: 0 0 15px rgba(212, 175, 55, 0.25);
        }
        .input-wrapper input:focus + i, .input-wrapper:focus-within i { color: #d4af37; }

        /* Buttons */
        .btn-row { display: flex; gap: 10px; margin-top: 10px; }
        .gold-btn {
            background: linear-gradient(135deg, #dfbc77 0%, #bd9342 100%); flex:1;
            color: #000; font-weight: 600; border: none; padding: 12px; border-radius: 8px; font-size: 14px;
            cursor: pointer; transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex; justify-content: center; align-items: center; gap: 8px;
            box-shadow: 0 4px 15px rgba(189, 147, 66, 0.2);
        }
        .gold-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(189, 147, 66, 0.3); filter: brightness(1.1); }
        
        .cancel-btn {
            background: transparent; flex: 1; border: 1px solid #444; color: #ccc;
            padding: 12px; border-radius: 8px; font-size: 14px; text-decoration: none;
            display: flex; justify-content: center; align-items: center; gap: 8px; transition: all 0.3s;
        }
        .cancel-btn:hover { background: #222; color: #fff; border-color: #888; }

    </style>
</head>
<body>

    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <div class="card-wrapper">
        <div class="auth-card">
            
            <div class="logo-row">
                <div class="logo-display">
                    <div class="logo-icon"><i class="fas fa-bullseye"></i></div>
                    <div>LEDGER<span style="font-weight:300; opacity:0.8;">PRO</span></div>
                </div>
                <a href="/" style="color:#777; font-size:12px; text-decoration:none;"><i class="fas fa-times"></i></a>
            </div>

            <h2 class="serif-text">Edit Record</h2>

            <form method="POST">
                
                <div class="form-group">
                    <label>Name</label>
                    <div class="input-wrapper">
                        <i class="far fa-user"></i>
                        <input type="text" name="name" value="{{ r[2] }}" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Amount</label>
                    <div class="input-wrapper">
                        <i class="fas fa-rupee-sign"></i>
                        <input type="number" name="amount" value="{{ r[3] }}" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Type</label>
                    <div class="input-wrapper">
                        <i class="fas fa-exchange-alt"></i>
                        <select name="type" required>
                            <option value="given" {% if r[4]=='given' %}selected{% endif %}>💸 I Gave (Collect later)</option>
                            <option value="received" {% if r[4]=='received' %}selected{% endif %}>📥 I Took (Pay later)</option>
                        </select>
                        <i class="fas fa-chevron-down"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label>Date</label>
                    <div class="input-wrapper">
                        <i class="far fa-calendar-alt"></i>
                        <input type="date" name="date" value="{{ r[5] }}" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Reason</label>
                    <div class="input-wrapper">
                        <i class="fas fa-comment-dots"></i>
                        <input type="text" name="reason" value="{{ r[6] }}">
                    </div>
                </div>

                <div class="btn-row">
                    <a href="/" class="cancel-btn">Cancel</a>
                    <button type="submit" class="gold-btn">Update Record</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Mouse Tracker script -->
    <script>
        const shine = document.createElement('div');
        shine.className = 'cursor-shine';
        document.body.appendChild(shine);

        window.addEventListener('mousemove', (e) => {
            shine.style.opacity = '1';
            shine.style.left = e.clientX + 'px';
            shine.style.top = e.clientY + 'px';
        });

        window.addEventListener('mouseout', (e) => {
            if (e.relatedTarget === null) {
                shine.style.opacity = '0';
            }
        });
    </script>
</body>
</html>
