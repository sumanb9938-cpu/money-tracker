<!DOCTYPE html>
<html>
<head>
<title>Edit</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">

<h3>Edit Record</h3>

<form method="POST">

<input name="name" value="{{ r[2] }}" class="form-control mb-2">
<input name="amount" value="{{ r[3] }}" class="form-control mb-2">

<select name="type" class="form-control mb-2">
<option value="given" {% if r[4]=='given' %}selected{% endif %}>💸 Gave</option>
<option value="received" {% if r[4]=='received' %}selected{% endif %}>📥 Took</option>
</select>

<input name="date" value="{{ r[5] }}" class="form-control mb-2">
<input name="reason" value="{{ r[6] }}" class="form-control mb-2">

<button class="btn btn-success">Update</button>

</form>

</body>
</html>
